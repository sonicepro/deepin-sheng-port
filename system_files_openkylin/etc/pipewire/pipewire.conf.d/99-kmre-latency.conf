# Bigger PipeWire buffer so playback tolerates CPU spikes (Android app launch
# under kmre) without xruns. default quantum 1024 (~21ms) is too tight on this
# budget-class setup; raise it. Drop-in: no need to edit the stock config.
context.properties = {
    default.clock.quantum     = 2048
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 8192
}
