# sheng (Xiaomi Pad 6S Pro) / SM8550 audio: do NOT let snd-sc8280xp autoload.
#
# The machine driver would otherwise probe ~10 s into boot, before the ADSP
# audio subsystem is ready; that probe fails with -22 and wedges the ADSP q6APM
# session so the card never comes up ("no soundcards"). system_files ships
# sheng-audio-rebind.service / sheng-audio-rebind.sh which load this module once
# the ADSP + SoundWire codec are ready. modprobe still works (only autoload is
# blocked); the codec core (snd_soc_wcd938x) is loaded via
# /etc/modules-load.d/sheng-audio.conf as before.
blacklist snd_soc_sc8280xp
