# sheng: cut the delay-inhibitor wait before suspend.
#
# kylin-process-manager holds a "sleep" delay lock and does not release it before
# logind's timeout (observed at ~5s), so logind waits the full default
# InhibitDelayMaxSec (5s) before forcing the suspend. During that window the
# compositor has already blanked the screen (on PrepareForSleep) but the system is
# NOT asleep yet, so pressing the power key does nothing -- it looks dead. 1s
# instead of 5s shrinks that window.
#
# (suspend -> resume still has the inherent s2idle round-trip cost; this only
# removes the avoidable pre-suspend wait.)
InhibitDelayMaxSec=1
