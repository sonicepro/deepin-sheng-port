[Service]
# PipeWire's data-loop needs SCHED_FIFO; module-rt's direct path is gated by
# RLIMIT_RTPRIO, which the desktop session user has at 0 (not in the `pipewire`
# group, rtkit not installed). Give the pipewire user service an RT budget.
# (system-wide user-unit override: applies to every session user.)
LimitRTPRIO=95
LimitMEMLOCK=infinity
