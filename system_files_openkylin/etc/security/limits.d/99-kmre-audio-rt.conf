# Real-time priority for audio. PipeWire's data thread needs SCHED_FIFO; the
# openKylin default limits only grant rtprio to the `pipewire` group, which the
# desktop session user isn't in, and rtkit isn't installed -> PipeWire ran as
# SCHED_OTHER. Result: when a heavy Android (kmre) app launches and spikes the
# CPU, the audio renderer is preempted and playback underruns (choppy sound).
# Grant rtprio to the `audio` group (the session user is in it).
@audio    -   rtprio    95
@audio    -   memlock   4194304
