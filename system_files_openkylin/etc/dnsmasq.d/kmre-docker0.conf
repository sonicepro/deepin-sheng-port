interface=docker0
bind-interfaces
# dnsmasq ignores loopback nameservers, so /etc/resolv.conf (127.0.0.53,
# systemd-resolved's stub) yields NO upstream -> all queries REFUSED -> the
# Android container (net.dns1=172.17.0.1) gets UnknownHostException (no images).
# Use systemd-resolved's REAL uplink list (the actual router DNS, dynamic).
resolv-file=/run/systemd/resolve/resolv.conf
# Plus a public fallback in case the uplink file is empty/unusable.
server=223.5.5.5
dhcp-range=172.17.0.100,172.17.0.250,12h
dhcp-option=3,172.17.0.1
dhcp-option=6,172.17.0.1
