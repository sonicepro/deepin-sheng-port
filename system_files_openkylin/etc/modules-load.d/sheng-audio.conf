# sheng (Xiaomi Pad 6S Pro) / SM8550 audio: the WCD938x SoundWire codec core
# driver must be loaded for the SM8550 sound card ("snd-sc8280xp", platform
# device "sound") to bind. Its OF node /audio-codec (compatible
# qcom,wcd9380-codec) is not autoloaded by udev coldplug on openKylin, so
# without this the card defers forever:
#   platform sound: deferred probe pending: snd-sc8280xp: WCD Playback: codec dai not found
# and the system reports "no soundcards". Loading it registers the WCD938x
# component/DAIs; snd-soc-wcd938x-sdw is pulled in automatically as a
# dependency.
snd_soc_wcd938x
