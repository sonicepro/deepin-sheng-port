# .github/workflows/build-openkylin3.yml
# Build an openKylin 3.0 (huanghe) arm64 rootfs for Xiaomi Pad 6S Pro (sheng) by
# EXTRACTING openKylin's official arm64 release image (the same approach as the
# Deepin build), instead of bootstrapping from the (incomplete) live apt repo.
#
# Provide the image URL in the openkylin_img_url input — openKylin's download
# page is JS-rendered so there is no stable hardcoded URL. ISO / .img.xz /
# .tar.* / .zip are all accepted (auto-detected).
#
# Output: openkylin_<ver>_<mode>_<ts>.img.gz (Android-sparse ext4 rootfs)
# Boot images (from the same kernel .deb):
#   boot_sheng_singleboot.img -> root=PARTLABEL=userdata  (single)
#   boot_sheng_dualboot.img   -> root=PARTLABEL=linux     (dual)
name: Build openKylin 3 from image

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本'
        required: true
        default: '7.1'
      kernel_channel:
        description: '内核通道'
        required: true
        type: choice
        options: [stable, mainline]
        default: 'stable'
      boot_mode:
        description: '启动模式'
        required: true
        type: choice
        options: [single, dual, all]
        default: 'dual'
      openkylin_img_url:
        description: 'openKylin 3.0 arm64 镜像直链（ISO / .img.xz / .tar.* / .zip，必填）'
        required: true
        default: 'https://cdimage.openkylin.top/3.0/openKylin-Desktop-V3.0-20260905-arm64.iso'
      openkylin_version:
        description: '版本号（仅用于产物命名）'
        required: false
        default: '3.0'
      skip_release:
        description: '跳过创建 GitHub Release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell || true
          sudo apt-get clean
          df -h / || true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl wget jq rsync xz-utils zstd unzip file \
            squashfs-tools util-linux android-sdk-libsparse-utils aria2 pigz

      - name: Download sheng kernel .deb (from this repo's releases)
        env:
          KVER: ${{ inputs.kernel_version }}
          CHANNEL: ${{ inputs.kernel_channel }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          got=0
          for TAG in "kernel-bundle-${CHANNEL}-${KVER}" "kernel-bundle-${KVER}" kernel-bundle-latest; do
            echo "==> trying release tag: ${TAG}"
            if curl -fsSL "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" -o rel.json; then
              if jq -e '.assets | length > 0' rel.json >/dev/null 2>&1; then
                jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url' rel.json | while read -r u; do
                  echo "   download $(basename "$u")"
                  curl -fsSL -O "$u"
                done
                got=1
                break
              fi
            fi
          done
          [ "$got" -eq 1 ] || { echo "ERROR: no kernel release found"; exit 1; }
          ls -la ./*.deb

      - name: Build openKylin rootfs (from image)
        env:
          OPENKYLIN_IMG_URL: ${{ inputs.openkylin_img_url }}
          OPENKYLIN_VERSION: ${{ inputs.openkylin_version }}
          FIRMWARE_URL: https://github.com/${{ github.repository }}/releases/download/kernel-bundle-${{ inputs.kernel_version }}/sheng-firmware-master.tar.gz
          MIPPS_DEB_URL: https://github.com/${{ github.repository }}/releases/download/kernel-bundle-${{ inputs.kernel_version }}/xiaomi-mipps-auth.deb
        run: |
          set -euo pipefail
          sudo -E bash sheng-openkylin3-rootfs_build.sh \
            openkylin3-desktop "${{ inputs.kernel_version }}" "${{ inputs.boot_mode }}" dde
          ls -la ./*.img.gz

      - name: Build boot images from the kernel .deb
        run: |
          set -euo pipefail
          deb=$(ls linux-xiaomi-sheng*.deb | head -1)
          [ -n "$deb" ] || { echo "ERROR: linux-xiaomi-sheng.deb not found"; ls -la; exit 1; }
          rm -rf kdeb && mkdir kdeb
          dpkg-deb -x "$deb" kdeb
          payload=""
          for c in kdeb/boot/Image.gz-dtb_sheng kdeb/boot/zImage_sheng; do
            [ -f "$c" ] && payload="$c" && break
          done
          if [ -z "$payload" ]; then
            [ -f kdeb/boot/Image.gz ] && [ -f kdeb/boot/sm8550-xiaomi-sheng.dtb ] \
              || { echo "ERROR: kernel payload missing in deb"; find kdeb/boot -type f; exit 1; }
            cat kdeb/boot/Image.gz kdeb/boot/sm8550-xiaomi-sheng.dtb > zImage_sheng
            payload=zImage_sheng
          fi
          echo "==> kernel payload: $payload"
          python3 mkbootimg --kernel "$payload" \
            --cmdline "root=PARTLABEL=userdata rootwait rw fsck.repair=yes" \
            --base 0x00000000 --kernel_offset 0x00008000 --tags_offset 0x01e00000 --pagesize 4096 \
            -o boot_sheng_singleboot.img
          python3 mkbootimg --kernel "$payload" \
            --cmdline "root=PARTLABEL=linux rootwait rw fsck.repair=yes" \
            --base 0x00000000 --kernel_offset 0x00008000 --tags_offset 0x01e00000 --pagesize 4096 \
            -o boot_sheng_dualboot.img
          ls -la boot_sheng_*.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkylin3-rootfs-${{ inputs.boot_mode }}
          path: |
            openkylin_*.img.gz
            boot_sheng_*.img
          retention-days: 7
          if-no-files-found: error

      - name: Stage release assets (split >2 GiB, add boot images)
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          cp boot_sheng_*.img release/ 2>/dev/null || true
          for f in openkylin_*.img.gz; do
            sz=$(stat -c %s "$f")
            if [ "$sz" -gt 2000000000 ]; then
              echo "==> ${f} is ${sz} bytes (>2 GiB); splitting into 1900M parts"
              split -b 1900M -d -a 3 "$f" "release/${f}.part."
            else
              mv "$f" release/
            fi
          done
          echo "==> release assets:"
          ls -la release/

      - name: Create release
        if: ${{ !inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openkylin3-${{ github.run_number }}
          name: "openKylin 3 rootfs (from image) build ${{ github.run_number }}"
          body: |
            **openKylin 3.0 (huanghe) arm64 rootfs — Xiaomi Pad 6S Pro (sheng)**

            | 项目 | 详情 |
            |------|------|
            | 内核 | ${{ inputs.kernel_version }} / ${{ inputs.kernel_channel }} |
            | 源镜像 | `${{ inputs.openkylin_img_url }}` |
            | 启动模式 | ${{ inputs.boot_mode }} |

            > 从 openKylin 官方 arm64 镜像提取用户态（参考 Deepin 的做法）。
            > GitHub Release 单资产上限 2 GiB，超过的按 1900M 分卷成 `*.part.000` …
            > 合并 + 解压：`cat openkylin_*.img.gz.part.* | gzip -d > openkylin.img`
          files: release/*
