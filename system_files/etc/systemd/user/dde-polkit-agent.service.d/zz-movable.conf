# Make the polkit password dialog movable (sheng port).
#
# dde-polkit-agent's AuthDialog sets Qt::BypassWindowManagerHint on X11, which
# makes the dialog an override-redirect window that the window manager cannot
# move. Preload a tiny interposer that strips that one flag so the dialog is a
# normal, draggable window.
#
# The .so is built by sheng-deepin-rootfs_build.sh into
# /usr/local/lib/dde-sheng-movable/libpolkitmove.so.
[Service]
Environment=LD_PRELOAD=/usr/local/lib/dde-sheng-movable/libpolkitmove.so
