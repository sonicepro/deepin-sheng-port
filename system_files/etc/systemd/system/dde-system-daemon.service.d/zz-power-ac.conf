# Make dde-daemon compute a correct OnBattery (sheng port).
#
# dde-daemon's power1 module sets OnBattery only from a power_supply of type
# "mains". The sheng kernel exposes only USB/Wireless line-power, so OnBattery
# stays false and DDE always shows "charging". Preload a small interposer that
# presents the USB port as a Mains supply with a battery-derived online state.
#
# The .so is built by sheng-deepin-rootfs_build.sh into
# /usr/local/lib/dde-sheng-power/libdde-power-ac.so.
[Service]
Environment=LD_PRELOAD=/usr/local/lib/dde-sheng-power/libdde-power-ac.so
