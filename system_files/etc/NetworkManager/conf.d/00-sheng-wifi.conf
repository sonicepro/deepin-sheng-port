# sheng: disable WiFi MAC randomization.
#
# NetworkManager was activating WiFi with a per-boot random MAC; each saved WiFi
# profile ended up bound to the then-current random MAC (802-11-wireless.mac-address
# in the connection). After a reboot the interface presents a different random MAC,
# the saved profile no longer matches -> no autoconnect (and duplicate profiles for
# the same SSID piling up, each pinned to a different MAC). Pin the permanent
# hardware MAC instead so autoconnect keeps working.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
